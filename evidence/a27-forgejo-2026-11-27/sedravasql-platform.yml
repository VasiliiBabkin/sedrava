name: SedravaSQL A27 platform qualification
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  sql:
    runs-on: vds-rust
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TARGET_DIR: /tmp/a27-target
      SOURCE_SHA: 60a7d0488a23135fa064b7cf2496f93a78b519bd
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify source and isolated environment
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = .forgejo/workflows/platform.yml
          test ! -e /var/lib/forgejo/data/forgejo.db
          test ! -S /var/run/docker.sock
          rustc --version
          cargo --version
          git rev-parse HEAD HEAD^
      - name: Root crate and native engine regression
        run: |
          set -eu
          cargo test --locked --all-targets
          cargo test --manifest-path native-engine/Cargo.toml --locked --all-targets
          cargo build --manifest-path native-engine/Cargo.toml --locked --bin sedravasql-native-preview
          sha256sum "$CARGO_TARGET_DIR/debug/sedravasql-native-preview"
          printf 'A27 SQL qualification PASS\n'
