[package]
name = "sedrava-core"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.85"
description = "Experimental native Rust core for the Sedrava programming language"
license = "Apache-2.0"
repository = "https://github.com/VasiliiBabkin/sedrava"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.16"

[[bin]]
name = "sedrava-native"
path = "src/main.rs"
