[package]
name = "sedrava-core"
version = "0.12.0-alpha.2"
edition = "2021"
rust-version = "1.85"
description = "Sedrava programming language compiler and runtime"
license = "Apache-2.0"
repository = "https://github.com/VasiliiBabkin/sedrava"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.16"
regex = "1"
roxmltree = "0.21"
sha2 = "0.10"
getrandom = "0.4"
sedravasql = { git = "https://github.com/VasiliiBabkin/sedravasql.git", rev = "363ccbc9542ed8e3ecf41e3619f78823ffeb97d4" }
toml = "0.8"
url = "=2.5.2"

[[bin]]
name = "sedrava"
path = "src/main.rs"

[[bin]]
name = "sedrava-native"
path = "src/bin/sedrava-native.rs"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process", "event"] }
