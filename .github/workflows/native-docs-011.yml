name: Native documentation and trusted demo contract
on:
  push:
    branches: [feature/011-native-docs]
  pull_request:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      SEDRAVA_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install '.[docs,test]' playwright==1.62.0
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python -m unittest discover -s tests -p 'test_native_docs.py' -v
      - run: python scripts/test_native_docs_browser.py
