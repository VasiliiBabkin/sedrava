name: Independent Host A3 security audit
on:
  push:
    branches: [security/host-a3-release-audit]
  pull_request:
    branches: [release/012-alpha1-acceptance]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  audit:
    name: Host security Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: |
          mkdir -p build/security-audit
          git rev-parse HEAD > build/security-audit/tested-sha.txt
          python --version > build/security-audit/python.txt
          python -m pip install '.[test,packages]'
      - name: Reproduce findings on exact original release commit
        run: |
          git worktree add --detach build/audit-baseline 102ae4a2198c1cdefb5ec65e0a37471370210287
          cp tests/test_host_a3_security_audit.py build/audit-baseline/tests/
          cd build/audit-baseline
          python - <<'PY'
          import json, pathlib, sys, unittest
          suite=unittest.defaultTestLoader.discover("tests", pattern="test_host_a3_security_audit.py")
          with open("../security-audit/baseline.log","w") as log:
              result=unittest.TextTestRunner(stream=log, verbosity=2).run(suite)
          expected={
              "test_temp_collision_preserves_existing_file",
              "test_list_symlink_is_policy_fault",
              "test_rmdir_symlink_is_policy_fault",
              "test_cli_transport_failure_never_fabricates_setup_rejection",
              "test_directory_entry_limit_is_data_failure_not_engine_fault",
          }
          # C decoder recursion behavior differs across CPython versions.
          # Probe the independent stdlib, not the Host result under test.
          decoder_recursion=False
          try:
              json.loads("[" * 1500 + "0" + "]" * 1500)
          except RecursionError:
              decoder_recursion=True
              expected.add("test_deep_json_input_is_expected_failure_not_python_recursion_fault")
          actual={test.id().rsplit(".",1)[1] for test,trace in result.failures}
          evidence={"source_sha":"102ae4a2198c1cdefb5ec65e0a37471370210287",
                    "tests":result.testsRun,"python":sys.version,"decoder_recursion":decoder_recursion,
                    "expected_failing_assertions":sorted(expected),
                    "actual_failing_assertions":sorted(actual),
                    "unexpected_errors":len(result.errors),"skipped":len(result.skipped)}
          pathlib.Path("../security-audit/baseline.json").write_text(json.dumps(evidence,indent=2)+"\n")
          print(json.dumps(evidence))
          assert actual==expected and not result.errors and not result.skipped, evidence
          PY
      - name: Fixed Host security regressions
        run: python -m unittest discover -s tests -p test_host_a3_security_audit.py -v 2>&1 | tee build/security-audit/security.log
      - name: Existing Host A1 A2 A3 tests
        run: |
          python -m unittest discover -s tests -p test_trusted_host_013.py -v 2>&1 | tee build/security-audit/a1.log
          python -m unittest discover -s tests -p test_trusted_host_a2.py -v 2>&1 | tee build/security-audit/a2.log
          python -m unittest discover -s tests -p test_host_a3_typed_protocol.py -v 2>&1 | tee build/security-audit/a3.log
      - name: Full existing Python and Node regression
        run: python -m unittest discover -s tests -v 2>&1 | tee build/security-audit/full.log
      - name: Documentation and release security guards
        run: |
          python scripts/check_docs.py
          python scripts/audit_release_security.py
      - name: Build and audit wheel and sdist without publication
        run: |
          python -m pip install build==1.3.0 twine==6.2.0
          python -m build
          python -m twine check dist/*
          python scripts/audit_dist.py
          python scripts/check_installed_dist.py
          python -m venv build/security-audit/installed
          build/security-audit/installed/bin/python -m pip install --no-deps dist/*.whl
          build/security-audit/installed/bin/sedrava host check examples/host_typed_read_013.sdr
          sha256sum dist/* > build/security-audit/dist-sha256.txt
      - name: Record actual exact-SHA security audit result
        run: |
          python - <<'PY'
          import json, os, pathlib, re, sys
          root=pathlib.Path("build/security-audit")
          baseline=json.loads((root/"baseline.json").read_text())
          suites={}
          for name in ("security","a1","a2","a3","full"):
              raw=(root/(name+".log")).read_text()
              count=int(re.findall(r"Ran (\d+) tests?",raw)[-1])
              skipped=re.findall(r"OK \(skipped=(\d+)\)",raw)
              skip=int(skipped[-1]) if skipped else 0
              assert re.search(r"\nOK(?:\s|$)",raw), name
              suites[name]={"total":count,"passed":count-skip,"skipped":skip}
          sha=(root/"tested-sha.txt").read_text().strip()
          run_url=os.environ["GITHUB_SERVER_URL"]+"/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"]
          result={"source_sha":sha,"original_sha":baseline["source_sha"],
                  "python":sys.version,"suites":suites,"baseline":baseline,
                  "run_url":run_url,"status":"CONDITIONAL_GO_TRUSTED_LOCAL_ONLY",
                  "publication_authorized":False}
          (root/"audit-result.json").write_text(json.dumps(result,indent=2)+"\n")
          report=pathlib.Path("docs/SECURITY_AUDIT_HOST_A3.md").read_text()
          report+="\n\n## Executed CI evidence (authoritative for this artifact)\n\n"
          report+="Tested SHA: **"+sha+"**. CI: "+run_url+"\n\n"
          report+="Python: "+sys.version.split()[0]+". Ubuntu 24.04 hosted runner.\n\n"
          report+="| Suite | Executed | Passed | Skipped |\n|---|---:|---:|---:|\n"
          for name,item in suites.items():
              report+=f"| {name} | {item['total']} | {item['passed']} | {item['skipped']} |\n"
          report+="\nOriginal-commit reproduction: "+str(len(baseline["actual_failing_assertions"]))+" expected failures, no unexpected errors. Decoder recursion probe: "+str(baseline["decoder_recursion"])+".\n"
          report+="\nWheel/sdist build, metadata/archive checks, clean installations, Host CLI, documentation and release-security guards completed successfully before this record was generated. Archive checksums are in dist-sha256.txt.\n"
          report+="\n**Original candidate: NO-GO. Patched exact-SHA Host audit: CONDITIONAL GO for trusted local experimental POSIX use only**, subject to the limits above. This is not approval to publish and not proof against all vulnerabilities. Full-suite skips are recorded, not counted as passed; browser/Android acceptance belongs to separate workflows.\n"
          (root/"SECURITY_AUDIT_HOST_A3.md").write_text(report)
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: host-a3-security-${{ matrix.python }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/security-audit/*.md
            build/security-audit/*.txt
            build/security-audit/*.json
            build/security-audit/*.log
          if-no-files-found: error
