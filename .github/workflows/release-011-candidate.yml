name: Sedrava 0.11.0rc1 read-only candidate verification

on:
  push:
    branches: [release/011-rc1-preparation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check candidate identity
        run: |
          python - <<'PY'
          from sedrava_version import VERSION, ANDROID_VERSION_CODE
          assert VERSION == '0.11.0rc1', VERSION
          assert ANDROID_VERSION_CODE == 11001, ANDROID_VERSION_CODE
          PY
      - name: Install read-only build tools
        run: python -m pip install build==1.3.0 twine==6.2.0
      - name: Complete Python and documentation checks
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_docs.py
          python scripts/audit_release_security.py
      - name: Inspect candidate distributions and clean installs
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/audit_dist.py
          python scripts/check_installed_dist.py
          python scripts/check_reproducible_dist.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sedrava-0.11.0rc1-unpublished-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
