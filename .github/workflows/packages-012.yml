name: Sedrava 0.12 B1 offline packages
on:
  push:
    branches: [feature/012-local-packages-b1]
  pull_request:
    paths:
      - "sedrava_packages.py"
      - "sedrava_modules.py"
      - "sedrava_cli.py"
      - "pyproject.toml"
      - "tests/test_packages_012.py"
      - "examples/packages_012_demo/**"
      - ".github/workflows/packages-012.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locked-packages:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install checked compiler dependencies
        run: python -m pip install ".[test]"
      - name: Verify package locking and namespace regressions
        run: |
          python -m unittest tests.test_packages_012 tests.test_module_provenance_012 tests.test_namespaced_modules_012 tests.test_platform_modules -v
      - name: Verify checked-in immutable example and build actual site
        run: |
          python -m sedrava_cli verify examples/packages_012_demo
          python -m sedrava_cli check examples/packages_012_demo/site.sdr
          python -m sedrava_cli build site examples/packages_012_demo/site.sdr --output build/locked-demo
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('build/locked-demo')
          assert 'Hello from a locked Sedrava package' in (root/'index.html').read_text()
          assert 'sedrava.lock' in json.loads((root/'sedrava-site.json').read_text())['inputs']
          PY
          git diff --exit-code -- examples/packages_012_demo/sedrava.lock
