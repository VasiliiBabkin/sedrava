name: Experimental server 0.13 A2 typed CRUD (read-only CI)
on:
  push:
    branches: [feature/013-server-typed-crud-a2]
  pull_request:
    branches: [feature/013-server-sqlite-migrations-a1]
permissions:
  contents: read
jobs:
  sqlite-api:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Real SQLite and ASGI typed API, invalid requests, CAS, disabled-by-default gates
        run: python -m unittest discover -s tests -p test_server_api_013.py -v
      - name: Retain verified A1 migrations and backups
        run: python -m unittest discover -s tests -p test_server_013.py -v
      - name: Built distribution contains the same server API
        run: |
          python -m pip install build==1.3.0 twine==6.2.0
          python -m build
          python -m twine check dist/*
          python scripts/audit_dist.py
      - name: Real loopback HTTP request/response and SQLite persistence
        run: |
          python -m pip install .
          python -m pip install uvicorn==0.35.0
          python scripts/test_server_api_network_013.py
      - name: Generate schema from A2 source and migrate a real SQLite DB
        run: |
          python -m pip install .
          sedrava check examples/server_013_api_tasks.sdr
          sedrava build server examples/server_013_api_tasks.sdr --output build/server-a2
          export SEDRAVA_DB_PATH="$RUNNER_TEMP/server-a2.sqlite"
          python build/server-a2/server.py migrate
          python build/server-a2/server.py check
          python - <<'PY'
          import json
          data=json.load(open('build/server-a2/schema.json',encoding='utf-8'))
          assert len(data['routes'])==5
          assert [r['action'] for r in data['routes']]==['list','create','read','update','delete']
          print('PASS: five typed routes, real persistent SQLite database')
          PY
