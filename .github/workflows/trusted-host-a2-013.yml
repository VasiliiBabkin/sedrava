name: Experimental trusted host A2 (scoped JSON and directories)
on:
  push:
    branches: [feature/013-trusted-host-a2]
  pull_request:
    branches: [feature/013-trusted-host-a1]
permissions:
  contents: read
jobs:
  host-a2:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: python -m pip install '.[test]'
      - name: Host A2 JSON, capability, scope and browser isolation tests
        run: python -m unittest discover -s tests -p test_trusted_host_a2.py -v
      - name: A1 compatibility and security regression
        run: python -m unittest discover -s tests -p test_trusted_host_013.py -v
      - name: Full Python regression
        run: python -m unittest discover -s tests -v
      - name: Execute real JSON/directory inventory and refuse browser build
        run: |
          set -eu
          mkdir -p build/host-a2/inbox build/host-a2/outbox
          printf '{"title":"Inventory"}' > build/host-a2/inbox/config.json
          python sedrava_cli.py host check examples/host_inventory_013.sdr
          python sedrava_cli.py host run examples/host_inventory_013.sdr \
            --root build/host-a2 --trusted --allow-read --allow-list --allow-write \
            --read-scope inbox --list-scope inbox --write-scope outbox \
            --arg input=config.json
          test -f build/host-a2/outbox/inventory.json
          python -c 'import json; f=json.load(open("build/host-a2/outbox/inventory.json")); assert f["count"]==1 and f["title"]=="Inventory"'
          if python sedrava_cli.py build web examples/host_inventory_013.sdr --output build/host-a2/unsafe.html; then
            echo "SECURITY REGRESSION: host document built for browser"; exit 1
          fi
          test ! -e build/host-a2/unsafe.html
      - name: Package wheel/sdist and exercise installed CLI
        run: |
          python -m pip install build==1.3.0 twine==6.2.0
          python -m build
          python -m twine check dist/*
          python scripts/audit_dist.py
          python -m venv build/host-a2/isolated-env
          build/host-a2/isolated-env/bin/python -m pip install --no-deps dist/*.whl
          build/host-a2/isolated-env/bin/sedrava host check examples/host_inventory_013.sdr
