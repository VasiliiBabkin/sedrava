name: Publish Sedrava 0.10.0

on:
  push:
    tags: ['v0.10.0']
  workflow_dispatch:
    inputs:
      target:
        description: 'Manual publication is TestPyPI only'
        required: true
        type: choice
        default: testpypi
        options: [testpypi]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Verify package version
        run: |
          python - <<'PY'
          import os
          from sedrava_version import VERSION, ANDROID_VERSION_CODE
          assert VERSION == "0.10.0", VERSION
          assert ANDROID_VERSION_CODE == 10003, ANDROID_VERSION_CODE
          if os.environ.get("GITHUB_EVENT_NAME") == "push":
              assert os.environ.get("GITHUB_REF") == "refs/tags/v0.10.0"
          PY
      - name: Test and build
        run: |
          python -m unittest discover -s tests -v
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python scripts/audit_dist.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sedrava-0.10.0-dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: ${{ github.event_name == 'push' && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sedrava-0.10.0-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ github.event_name == 'push' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
