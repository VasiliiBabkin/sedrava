name: Prepare experimental RC kit (no publication)
on:
  # Historical candidate packaging: manual only after stable 0.10.0 publication.
  # Pull-request validation is handled by ordinary CI/Android/distribution jobs.
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed SHA; empty uses this workflow ref
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: rc-preparation-${{ github.event.pull_request.head.sha || inputs.source_sha || github.sha }}
  cancel-in-progress: false
jobs:
  candidate:
    # Manual archival RC reproducibility; never create a new RC on documentation PRs.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CHECKED_SHA: ${{ github.event.pull_request.head.sha || inputs.source_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CHECKED_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve the single source version
        id: version
        run: |
          python - <<'PYTHON'
          import os
          from sedrava_version import VERSION
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('version='+VERSION+'\n')
          PYTHON
      - name: Verify checkout and assemble only same-SHA tested bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prepare_rc.py --sha "$CHECKED_SHA" --output build/rc-candidate
      - name: Independent inventory and checksum verification
        run: |
          python scripts/verify_rc_bundle.py build/rc-candidate
          cd build/rc-candidate
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: kit
        with:
          name: sedrava-${{ steps.version.outputs.version }}-candidate
          path: build/rc-candidate/*
          if-no-files-found: error
          retention-days: 90
      - name: Download and verify the immutable delivery (no guessed artifact links)
        env:
          GH_TOKEN: ${{ github.token }}
          KIT_ID: ${{ steps.kit.outputs.artifact-id }}
          KIT_URL: ${{ steps.kit.outputs.artifact-url }}
          KIT_DIGEST: ${{ steps.kit.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from sedrava_version import VERSION
          from scripts.rc_api import GitHub
          from scripts.prepare_rc import verify_uploaded_kit
          kit=Path('build/rc-candidate')
          data={'schema':1,'version':VERSION,'git_sha':os.environ['CHECKED_SHA'],
                'run_id':int(os.environ['GITHUB_RUN_ID']),'artifact_id':int(os.environ['KIT_ID']),
                'artifact_url':os.environ['KIT_URL'],'artifact_zip_sha256':os.environ['KIT_DIGEST'],
                'sha256sums_sha256':hashlib.sha256((kit/'SHA256SUMS').read_bytes()).hexdigest(),
                'status':'GO_FOR_OWNER_REVIEW','publication_authorized':False}
          result=verify_uploaded_kit(GitHub('VasiliiBabkin/sedrava'),data['artifact_id'],data['git_sha'],data['run_id'],data['artifact_zip_sha256'],{p.name:p.read_bytes() for p in kit.iterdir()})
          data.update(result)
          Path('build/rc-delivery.json').write_text(json.dumps(data,sort_keys=True,indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## Experimental RC kit — not published\n\n'+json.dumps(data,indent=2)+'\n')
          print(json.dumps(data,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sedrava-${{ steps.version.outputs.version }}-delivery
          path: build/rc-delivery.json
          if-no-files-found: error
