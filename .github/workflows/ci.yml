name: Sedrava Rust checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Rust workspace
        working-directory: rust
        run: |
          rustup show
          cargo test --locked --all-targets
          cargo build --locked --release --bins
      - name: Canonical CLI smoke
        run: |
          rust/target/release/sedrava --version
          rust/target/release/sedrava check examples/counter.sdr
          rust/target/release/sedrava test examples/counter.sdr
          python3 -B scripts/verify_native_alpha_012.py --native rust/target/release/sedrava
          python3 -B scripts/verify_native_preview_install.py
