name: Sedrava 0.12.0a1 release candidate (read-only)
on:
  push:
    branches: [release/012-alpha1-acceptance]
  pull_request:
    branches: [integration/013-host-a3-typed-errors]
permissions:
  contents: read
jobs:
  alpha-candidate:
    name: Read-only 0.12.0a1 acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify experimental alpha identity
        run: |
          python - <<'PY'
          from sedrava_version import VERSION, ANDROID_VERSION_CODE
          assert VERSION == '0.12.0a1', VERSION
          assert ANDROID_VERSION_CODE == 12001, ANDROID_VERSION_CODE
          from pathlib import Path
          for path in (
              'docs/RELEASE_NOTES_0_12_0a1.ru.md',
              'docs/RELEASE_NOTES_0_12_0a1.en.md',
              'docs/RELEASE_TRACK_012_ALPHA.md',
              'docs/HOST_013_A3.ru.md',
              'docs/HOST_013_A3.en.md',
          ):
              assert Path(path).is_file(), path
          PY
      - name: Check master and derived logo byte identities
        run: |
          set -eu
          cd assets/brand
          echo 'da9c46be34b8a14d5fb262d3ae1bb18c4ff4b50badd8541837d2d8128d1e1fbb  sedrava-logo-primary.png' | sha256sum --check -
          sha256sum --check SHA256SUMS
      - name: Core, Host and compatibility tests
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_docs.py
          python scripts/audit_release_security.py
      - name: Build and independently audit candidate archives
        run: |
          python -m pip install build==1.3.0 twine==6.2.0
          python -m build
          python -m twine check dist/*
          python scripts/audit_dist.py
          python scripts/check_installed_dist.py
          python scripts/check_reproducible_dist.py
      - name: Verify packaged Host A3 and existing app examples
        run: |
          set -eu
          python sedrava_cli.py check examples/typed_errors_012.sdr
          python sedrava_cli.py test examples/typed_errors_012.sdr
          python sedrava_cli.py host check examples/host_typed_read_013.sdr
          python sedrava_cli.py host effects examples/host_typed_read_013.sdr > build-host-effects.json
          python -c 'import json; x=json.load(open("build-host-effects.json")); assert x["effective"] == ["host.fs.read"]'
      - name: Generate immutable candidate inventory
        run: |
          set -eu
          mkdir -p build/alpha-candidate
          (cd dist && sha256sum * > ../build/alpha-candidate/SHA256SUMS)
          cp dist/* build/alpha-candidate/
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from sedrava_version import VERSION,ANDROID_VERSION_CODE
          paths=sorted(Path('dist').iterdir())
          assert len(paths)==2
          assert {p.suffix for p in paths}=={'.whl','.gz'}
          item={
            "status":"NO_PUBLICATION",
            "schema":1,
            "version":VERSION,
            "android_version_code":ANDROID_VERSION_CODE,
            "source_sha":os.environ["GITHUB_SHA"],
            "files":[{"name":p.name,"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"bytes":p.stat().st_size} for p in paths],
            "notice":"CI artifact only; not a GitHub release, PyPI upload or approved production build"
          }
          Path('build/alpha-candidate/inventory.json').write_text(json.dumps(item,indent=2,sort_keys=True)+'\n')
          print(json.dumps(item,sort_keys=True))
          PY
          cd build/alpha-candidate
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sedrava-012a1-unpublished-${{ github.sha }}
          path: build/alpha-candidate/
          if-no-files-found: error
          retention-days: 30
