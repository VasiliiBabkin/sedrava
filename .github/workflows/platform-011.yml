name: Sedrava 0.11 integration acceptance
on:
  push:
    branches: [feature/011-web-platform-integration]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      SEDRAVA_BROWSER: ${{ matrix.engine }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Install browser and accessibility checker
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium ${{ matrix.engine }}
          npm install --prefix build/platform-a11y --no-audit --no-fund axe-core@4.10.3
      - name: Typed compiler regressions
        run: |
          mkdir -p build/platform-evidence
          set -o pipefail
          python -m unittest discover -s tests -p 'test_platform*.py' -v 2>&1 | tee build/platform-evidence/compiler.log
      - name: Build four untouched source projects
        run: |
          python -m sedrava_cli build site examples/platform_site.sdr --output build/platform/site
          for app in tasks catalog crm; do
            python -m sedrava_cli build webapp examples/platform_$app.sdr --output build/platform/$app
          done
      - name: Chromium user scenarios, six viewports and axe
        run: |
          set -o pipefail
          python scripts/test_platform_browser.py 2>&1 | tee build/platform-evidence/browser.log
      - name: Record actual checkout and file hashes
        if: always()
        run: python scripts/platform_receipt.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sedrava-011-platform-preview-${{ matrix.engine }}
          path: |
            build/platform/
            build/platform-evidence/
            build/platform-manifest.json
          if-no-files-found: error
  android-domain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
      - name: Generate common-IR app and Python JVM oracle
        run: python scripts/prepare_platform_android.py build/platform-android
      - name: APK, full-state JVM conformance and Lint
        run: gradle -p build/platform-android --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sedrava-011-common-ir-android
          path: |
            build/platform-android/app/build/outputs/apk
            build/platform-android/app/build/reports
            build/platform-android/app/build/test-results
          if-no-files-found: error
