name: Experimental trusted host A1 (local I/O boundary)
on:
  push:
    branches: [feature/013-trusted-host-a1]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  host-a1:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install declared test extras
        run: python -m pip install '.[test]'
      - name: Host security, CLI, capabilities and isolation tests
        run: python -m unittest discover -s tests -p test_trusted_host_013.py -v
      - name: Full legacy Python regression
        run: python -m unittest discover -s tests -v
      - name: Execute host fixture with explicit grants
        run: |
          set -eu
          mkdir -p build/host-a1
          printf 'Hello' > build/host-a1/input.txt
          python sedrava_cli.py host check examples/host_report_013.sdr
          python sedrava_cli.py host run examples/host_report_013.sdr \
            --root build/host-a1 --trusted --allow-read --allow-write \
            --arg input=input.txt --arg output=report.txt --arg heading=Report:
          test "$(cat build/host-a1/report.txt)" = "Report:Hello"
          if python sedrava_cli.py build web examples/host_report_013.sdr --output build/host-a1/unexpected.html; then
            echo "SECURITY REGRESSION: host document built for browser"; exit 1
          fi
          test ! -f build/host-a1/unexpected.html
      - name: Wheel/sdist and installed-host CLI
        run: |
          python -m pip install build==1.3.0 twine==6.2.0
          python -m build
          python -m twine check dist/*
          python scripts/audit_dist.py
          python -m venv build/host-a1/installed-env
          build/host-a1/installed-env/bin/python -m pip install --no-deps dist/*.whl
          build/host-a1/installed-env/bin/sedrava host check examples/host_report_013.sdr
