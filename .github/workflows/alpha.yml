name: Sedrava alpha checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  language-package:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install ".[test]"
      - name: Full Python regression with retained audit evidence
        shell: bash
        run: |
          mkdir -p build/stability
          python -m unittest discover -s tests -v 2>&1 | tee build/stability/python.log
      - run: python scripts/check_docs.py
      - run: python scripts/audit_release_security.py
      - run: python -m pip install -r requirements-rc.txt
      - run: git diff --exit-code
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/audit_dist.py
      - run: python scripts/check_reproducible_dist.py
        if: matrix.python == '3.12'
      - run: python scripts/check_installed_dist.py
      - run: python scripts/check_upgrade_rollback.py --output dist/UPGRADE_ROLLBACK.json
      - run: python scripts/record_rc_tools.py dist/BUILD_TOOLS.json
      - name: Bind stability report to actual SHA and Python results
        run: python scripts/write_stability_evidence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sedrava-stability-python-${{ matrix.python }}
          if-no-files-found: error
          path: build/stability/*
      - name: Install wheel outside source tree
        shell: bash
        run: |
          python -m venv /tmp/sedrava-clean
          /tmp/sedrava-clean/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/sedrava-clean/bin/sedrava --version
          /tmp/sedrava-clean/bin/sedrava check "$GITHUB_WORKSPACE/examples/reference_09.sdr"
          /tmp/sedrava-clean/bin/sedrava test "$GITHUB_WORKSPACE/examples/reference_09.sdr"
          /tmp/sedrava-clean/bin/sedrava run "$GITHUB_WORKSPACE/examples/reference_09.sdr" add
          /tmp/sedrava-clean/bin/sedrava build web "$GITHUB_WORKSPACE/examples/reference_09.sdr" --output '/tmp/build with spaces/index.html'
          /tmp/sedrava-clean/bin/sedrava build android "$GITHUB_WORKSPACE/examples/reference_09.sdr" --output '/tmp/android with spaces'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.python == '3.12'
        with:
          name: sedrava-alpha-distributions
          if-no-files-found: error
          path: dist/*
  chromium:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_web_browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sedrava-browser-traces
          if-no-files-found: warn
          path: build/browser/*
      - name: Generate Web examples
        run: |
          python -m pip install .
          python scripts/build_web_examples.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sedrava-web-examples
          if-no-files-found: error
          path: build/web/*
