name: Sedrava 0.12.0a1 read-only alpha candidate

on:
  push:
    branches: [release/012-alpha1-preparation]
  pull_request:
    branches: [main, integration/012-alpha1-stable-base]

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify isolated alpha candidate identity
        run: |
          python - <<'PY'
          from sedrava_version import VERSION, ANDROID_VERSION_CODE
          assert VERSION == '0.12.0a1', VERSION
          assert ANDROID_VERSION_CODE == 12001, ANDROID_VERSION_CODE
          PY
      - name: Install read-only build tools
        run: python -m pip install build==1.3.0 twine==6.2.0
      - name: Regression and documentation
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_docs.py
          python scripts/audit_release_security.py
      - name: Verify versioned offline dependencies
        run: |
          python -m sedrava_cli verify examples/packages_012_demo
          python -m sedrava_cli check examples/packages_012_demo/site.sdr
      - name: Audit and clean install both candidate archives
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/audit_dist.py
          python scripts/check_installed_dist.py
          python scripts/check_reproducible_dist.py
      - name: Real published 0.11.0 to experimental 0.12.0a1 and back
        run: python scripts/check_stable_to_alpha_012.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sedrava-0.12.0a1-unpublished-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
