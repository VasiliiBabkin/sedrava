name: Sedrava agent benchmark reporting

on:
  push:
    paths:
      - "benchmarks/agent/**"
      - "tests/test_agent_benchmark.py"
      - ".github/workflows/agent-benchmark.yml"
  pull_request:
    paths:
      - "benchmarks/agent/**"
      - "tests/test_agent_benchmark.py"
      - ".github/workflows/agent-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-reporting:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test reporting implementation
        run: python -m unittest discover -s tests -p test_agent_benchmark.py -v
      - name: Validate example and produce report
        run: python benchmarks/agent/analyze.py benchmarks/agent/sample-result.json --output agent-benchmark-summary.json
      - name: Upload example report
        uses: actions/upload-artifact@v4
        with:
          name: agent-benchmark-example-summary
          path: agent-benchmark-summary.json
