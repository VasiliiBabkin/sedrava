name: Sedrava agent benchmark reporting

on:
  push:
    paths:
      - "benchmarks/agent/**"
      - "tests/test_agent_benchmark.py"
      - ".github/workflows/agent-benchmark.yml"
  pull_request:
    paths:
      - "benchmarks/agent/**"
      - "tests/test_agent_benchmark.py"
      - ".github/workflows/agent-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-reporting:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Compile benchmark tooling
        run: python -m compileall -q benchmarks/agent
      - name: Test reporting implementation
        run: python -m unittest discover -s tests -p test_agent_benchmark.py -v
      - name: Validate example and produce report
        run: python benchmarks/agent/analyze.py benchmarks/agent/sample-result.json --output agent-benchmark-summary.json
      - name: Upload example report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-benchmark-example-summary
          path: agent-benchmark-summary.json

  browser-baselines:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          npm install --no-save --no-package-lock typescript@5.9.3
      - name: Compile TypeScript baseline
        run: ./node_modules/.bin/tsc --project benchmarks/agent/baselines/typescript/tsconfig.json
      - name: Run browser acceptance on both baselines
        run: python benchmarks/agent/run_baselines.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-benchmark-browser-baselines
          if-no-files-found: warn
          path: build/agent-benchmark-baselines/
