name: Web UI 0.11 site
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site-chromium:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - name: Build independent static site
        run: python -m sedrava_cli build site examples/web_ui_011_landing.sdr --output build/site
      - name: Real Chromium responsive and keyboard scenarios
        shell: bash
        run: |
          mkdir -p build/site-evidence
          set -o pipefail
          python scripts/test_site_browser.py 2>&1 | tee build/site-evidence/chromium.log
      - name: Bind artifact inventory to checkout
        run: python scripts/write_site_evidence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sedrava-web-ui-011
          if-no-files-found: error
          path: |
            build/site/
            build/site-evidence/
