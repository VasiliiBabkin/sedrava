name: Sedrava 0.10 text Android conformance
on:
  push:
    branches-ignore: [dev/offline-012]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  text-android:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        example: [profile, escaping]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || test "${PIPESTATUS[1]}" -eq 0
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'
      - name: Generate application and Python-oracle JVM tests
        shell: bash
        env:
          EXAMPLE: ${{ matrix.example }}
        run: |
          set -euo pipefail
          SOURCE=examples/text_profile.sdr
          if [ "$EXAMPLE" = escaping ]; then SOURCE=tests/fixtures/text_escaping.sdr; fi
          python -m pip install .
          sedrava check "$SOURCE"
          sedrava test "$SOURCE"
          sedrava build web "$SOURCE" --output "build/text-web/$EXAMPLE.html"
          sedrava build android "$SOURCE" --output build/text-android
          python scripts/prepare_text_android_tests.py build/text-android --source "$SOURCE"
      - name: Clean APK, Lint and JVM conformance
        working-directory: build/text-android
        run: gradle --no-daemon clean :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - name: Verify signed APK and permissions
        run: python scripts/verify_apk.py build/text-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sedrava-010-text-${{ matrix.example }}-apk-and-evidence
          if-no-files-found: error
          path: |
            build/text-android/app/build/outputs/apk/debug/app-debug.apk
            build/text-android/app/build/reports/lint-results-debug.*
            build/text-android/app/build/reports/tests
            build/text-android/app/build/test-results
            build/text-android/app/src
            build/text-web/*
