name: Sedrava experimental WebApp 0.11 B1
on:
  push:
    paths:
      - "sedrava_webapp.py"
      - "sedrava_cli.py"
      - "sedrava_frontend.py"
      - "sedrava_core.py"
      - "sedrava_syntax.py"
      - "examples/webapp_011_counter.sdr"
      - "tests/test_webapp.py"
      - "scripts/test_webapp_browser.py"
      - ".github/workflows/webapp-011.yml"
  pull_request:
    paths:
      - "sedrava_webapp.py"
      - "sedrava_cli.py"
      - "sedrava_frontend.py"
      - "sedrava_core.py"
      - "sedrava_syntax.py"
      - "examples/webapp_011_counter.sdr"
      - "tests/test_webapp.py"
      - "scripts/test_webapp_browser.py"
      - ".github/workflows/webapp-011.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webapp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: \${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Compile checker and run unit regressions
        run: |
          python -m compileall -q sedrava_webapp.py sedrava_cli.py tests/test_webapp.py scripts/test_webapp_browser.py
          python -m unittest discover -s tests -p test_webapp.py -v
      - name: Build real standalone WebApp
        run: |
          python -m sedrava_cli check examples/webapp_011_counter.sdr
          python -m sedrava_cli build webapp examples/webapp_011_counter.sdr --output build/webapp-011
          test -s build/webapp-011/index.html
          test -s build/webapp-011/app.js
          test -s build/webapp-011/app.css
      - name: Install browser
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Verify stateful WebApp in real Chromium
        shell: bash
        run: |
          mkdir -p build/webapp-evidence
          set -o pipefail
          python scripts/test_webapp_browser.py 2>&1 | tee build/webapp-evidence/chromium.log
      - name: Upload generated app and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sedrava-webapp-011-b1
          if-no-files-found: warn
          path: |
            build/webapp-011/
            build/webapp-evidence/
