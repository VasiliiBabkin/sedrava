name: Experimental server 0.13 SQLite migrations (no publishing)
on:
  push:
    branches: [feature/013-server-sqlite-migrations-a1]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Exercise real SQLite, migration refusal and backup
        run: python -m unittest discover -s tests -p test_server_013.py -v
      - name: Build restricted server and test its database/CLI
        run: |
          python sedrava_cli.py check examples/server_013_tasks.sdr
          python sedrava_cli.py build server examples/server_013_tasks.sdr --output build/server013
          export SEDRAVA_DB_PATH="$RUNNER_TEMP/sedrava-013.sqlite"
          python build/server013/server.py migrate
          python build/server013/server.py check
          python build/server013/server.py backup "$RUNNER_TEMP/sedrava-013-backup.sqlite"
          python - <<'PY'
          import os, sqlite3
          conn=sqlite3.connect(os.environ['SEDRAVA_DB_PATH'])
          assert conn.execute('select count(*) from _sedrava_migrations').fetchone()[0]==2
          fields={r[1] for r in conn.execute('pragma table_info(tasks)')}
          assert fields == {'id','title','done','note'}
          print('PASS: actual SQLite migration and durable schema')
          PY
      - name: Wheel/sdist include new runtime
        run: |
          python -m pip install build==1.3.0 twine==6.2.0
          python -m build
          python -m twine check dist/*
          python scripts/audit_dist.py
