name: Experimental 0.12 Effects & Targets A1
on:
  push:
    branches: [feature/012-effects-targets-a1]
  pull_request:
    branches: [integration/012-namespaces-bounded-core]
permissions:
  contents: read
jobs:
  effects-a1:
    name: Effects A1 Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10','3.12','3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: python -m pip install '.[test,packages]'
      - name: Core 0.12 effect and target contract tests
        run: python -m unittest discover -s tests -p test_effects_targets_012.py -v
      - name: Existing full compiler regression
        run: python -m unittest discover -s tests -v
      - name: Real example CLI and effect manifest checks
        run: |
          set -eu
          python sedrava_cli.py effects examples/effects_pure_012.sdr --target web > effects.json
          python -c 'import json; a=json.load(open("effects.json")); assert a["schema"]=="sedrava.effects.v1" and a["effective"]==[] and a["functions"][1]["effective"]==[]'
          python sedrava_cli.py check examples/effects_pure_012.sdr
          python sedrava_cli.py test examples/effects_pure_012.sdr
          python sedrava_cli.py build web examples/effects_pure_012.sdr --output build/effects/index.html
          test -f build/effects/index.html
      - name: Validate wheel and sdist
        run: |
          python -m pip install build==1.3.0 twine==6.2.0
          python -m build
          python -m twine check dist/*
          python scripts/audit_dist.py
          python -m venv build/effects/venv
          build/effects/venv/bin/python -m pip install --no-deps dist/*.whl
          build/effects/venv/bin/sedrava effects examples/effects_pure_012.sdr --target web
