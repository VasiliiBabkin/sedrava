name: Historical published 0.10 to stable 0.11 upgrade/rollback (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install build==1.3.0
      - name: Build exact-head candidate and install real archived packages outside checkout
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m build
          python scripts/check_upgrade_011.py --candidate-dist dist --candidate-sha "$CANDIDATE_SHA" --work "$RUNNER_TEMP/upgrade"
      - name: Retain exact packages, generated projects and measured receipts
        if: always()
        run: |
          mkdir -p build/upgrade-inputs
          cp -r dist build/upgrade-inputs/
          for item in published projects generated incompatible-capacity.sdr commands.log upgrade-install.json; do
            if test -e "$RUNNER_TEMP/upgrade/$item"; then cp -r "$RUNNER_TEMP/upgrade/$item" build/upgrade-inputs/; fi
          done
          python - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          root=Path('build/upgrade-inputs')
          (root/'inventory.json').write_text(json.dumps({'sha':json.loads((root/'upgrade-install.json').read_text())['candidate_sha'],'run_id':os.environ['GITHUB_RUN_ID'],'files':{p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sedrava-upgrade-inputs
          path: build/upgrade-inputs/
  browser:
    needs: packages
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sedrava-upgrade-inputs
          path: build/upgrade-inputs
      - run: |
          python -m pip install playwright==1.62.0
          sudo --preserve-env=GITHUB_ACTIONS python3 scripts/configure_ci_apt.py
          python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Real installed-output Web update, rollback and rejected-storage protection
        env:
          SEDRAVA_BROWSER: ${{ matrix.engine }}
        run: |
          set -o pipefail
          python scripts/test_upgrade_011_browser.py --work build/upgrade-inputs 2>&1 | tee build/upgrade-browser.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sedrava-upgrade-browser-${{ matrix.engine }}
          path: |
            build/upgrade-inputs/browser-*/
            build/upgrade-browser.log
  android:
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sedrava-upgrade-inputs
          path: build/upgrade-inputs
      - name: Build same-key APKs directly from the tested installed-wheel outputs
        run: |
          OLD=build/upgrade-inputs/generated/clean-old-wheel/task_manager_navigation-android
          NEW=build/upgrade-inputs/generated/clean-rc-wheel/task_manager_navigation-android
          python scripts/prepare_upgrade_011_android.py "$OLD" "$NEW"
          gradle -p "$OLD" --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
          gradle -p "$NEW" --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual APK update and permitted debug rollback, without clearing target data
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python scripts/test_upgrade_011_android.py --work build/upgrade-inputs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sedrava-upgrade-android-api35
          path: |
            build/upgrade-inputs/android-evidence/
            build/upgrade-inputs/generated/clean-old-wheel/task_manager_navigation-android/app/build/outputs/
            build/upgrade-inputs/generated/clean-rc-wheel/task_manager_navigation-android/app/build/outputs/
            build/upgrade-inputs/generated/clean-old-wheel/task_manager_navigation-android/app/build/reports/
            build/upgrade-inputs/generated/clean-rc-wheel/task_manager_navigation-android/app/build/reports/
  report:
    if: always()
    needs: [packages, browser, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: sedrava-upgrade-*
          path: build/upgrade-evidence
      - name: Emit GO only from complete successful exact-head receipts
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/report_upgrade_011.py build/upgrade-evidence --sha "$CANDIDATE_SHA" --jobs "$JOB_RESULTS" --output build/upgrade-final-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sedrava-upgrade-final-report
          path: build/upgrade-final-report.*
