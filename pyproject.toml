[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sedrava"
dynamic = ["version"]
description = "Sedrava Programming Language: experimental declarative language for applications"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{name = "Sedrava contributors"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
test = ["tomli>=2; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/VasiliiBabkin/sedrava"
Documentation = "https://github.com/VasiliiBabkin/sedrava/blob/main/docs/QUICKSTART.md"
Issues = "https://github.com/VasiliiBabkin/sedrava/issues"

[project.scripts]
sedrava = "sedrava_cli:main"

[tool.setuptools]
py-modules = ["sedrava", "sedrava_version", "sedrava_android_identity", "sedrava_core", "sedrava_navigation", "sedrava_navigation_web", "sedrava_navigation_android", "sedrava_records", "sedrava_records_codegen", "sedrava_collections", "sedrava_cli", "android_codegen", "android_codegen_v03", "web_codegen", "sedrava_http", "sedrava_http_parser", "sedrava_http_codegen", "sedrava_http_page", "sedrava_http_embed", "sedrava_http_inline"]

# Installed examples and references are available under sys.prefix/share/sedrava.
[tool.setuptools.data-files]
"share/sedrava" = ["README.md", "CHANGELOG.md", "LICENSE", "DEDICATION.md"]
"share/sedrava/docs" = ["docs/*.md"]
"share/sedrava/examples" = ["examples/*.sdr", "examples/README.md"]

[tool.setuptools.dynamic]
version = {attr = "sedrava_version.VERSION"}
